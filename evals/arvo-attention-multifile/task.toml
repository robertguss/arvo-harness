schema_version = "1.4"

[task]
name = "arvo-harness/arvo-attention-multifile"
version = "1.0.0"
description = "Arvo progressive attention multifile: rename a function across three ~12 KB cross-referencing files with a mandated full re-read before each edit; expect on runs to serve re-reads from the cold shelf (reuse_cold) instead of re-ingesting (does the cold shelf get reused?)"
keywords = ["arvo", "progressive-attention", "attention", "multifile", "reuse", "harbor", "metrics"]

[metadata]
category = "programming"
difficulty = "easy"
difficulty_explanation = "Mechanical rename across three files; the design load is the mandated re-read before each edit that exercises same-path reuse"
agent_under_test = "arvo-chat"
suite = "arvo-attention"

[verifier]
timeout_sec = 120.0
# Verifier only greps workspace + audit JSONL — no network
network_mode = "no-network"

[agent]
timeout_sec = 900.0
# Live xAI completions for arvo-chat
network_mode = "allowlist"
allowed_hosts = ["api.x.ai", "*.x.ai", "auth.x.ai"]

[solution]
# Oracle needs no credentials

[environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
# API key: pass at agent run time only via `harbor run --ae XAI_API_KEY`
# Release tarball uploaded by ArvoAgent (never bake into image)
