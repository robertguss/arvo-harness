schema_version = "1.4"

[task]
name = "arvo-harness/arvo-attention-needle-junk"
version = "1.0.0"
description = "Arvo progressive attention needle-junk: one small relevant file among three ~95 KB archives the agent must read; expect junk chunks stubbed once the exception budget is spent and hot bytes far below off (does the firewall select, not just compress?)"
keywords = ["arvo", "progressive-attention", "attention", "needle-junk", "harbor", "metrics"]

[metadata]
category = "programming"
difficulty = "easy"
difficulty_explanation = "Single rename edit in a small file; the load is the three oversized archives the task forces the agent to read fully"
agent_under_test = "arvo-chat"
suite = "arvo-attention"

[verifier]
timeout_sec = 120.0
# Verifier only greps workspace + audit JSONL — no network
network_mode = "no-network"

[agent]
# ~287 KB of forced reads on the off arm; reread (123 KB) fit in 900s, so 2.5x headroom
timeout_sec = 1500.0
# Live xAI completions for arvo-chat
network_mode = "allowlist"
allowed_hosts = ["api.x.ai", "*.x.ai", "auth.x.ai"]

[solution]
# Oracle needs no credentials

[environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
# API key: pass at agent run time only via `harbor run --ae XAI_API_KEY`
# Release tarball uploaded by ArvoAgent (never bake into image)
