schema_version = "1.4"

[task]
name = "coding-agent-harness/arvo-attention-reread"
version = "1.0.0"
description = "Arvo progressive attention on/off: large re-read + edit; score task success, honesty, stub/reuse waste signals from shared audit trail"
keywords = ["arvo", "progressive-attention", "attention", "reread", "harbor", "metrics"]

[metadata]
category = "programming"
difficulty = "medium"
difficulty_explanation = "Large file re-read then edit; attention-on should stub/reuse second projection; audit trail must show treatment"
agent_under_test = "arvo-chat"
suite = "arvo-attention"

[verifier]
timeout_sec = 120.0
# Verifier only greps workspace + audit JSONL — no network
network_mode = "no-network"

[agent]
timeout_sec = 900.0
# Live xAI completions for arvo-chat
network_mode = "allowlist"
allowed_hosts = ["api.x.ai", "*.x.ai", "auth.x.ai"]

[solution]
# Oracle needs no credentials

[environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
# API key: pass at agent run time only via `harbor run --ae XAI_API_KEY`
# Release tarball uploaded by ArvoAgent (never bake into image)
