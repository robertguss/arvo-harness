schema_version = "1.4"

[task]
name = "arvo-harness/arvo-attention-small-control"
version = "1.0.0"
description = "Arvo progressive attention on/off control: tiny files, quick rename edit; expect zero stubs and waste_ratio ~1.0 (does attention tax simple work?)"
keywords = ["arvo", "progressive-attention", "attention", "control", "harbor", "metrics"]

[metadata]
category = "programming"
difficulty = "easy"
difficulty_explanation = "Small files, single rename edit; every tool output sits below the stub threshold so attention on/off should behave identically"
agent_under_test = "arvo-chat"
suite = "arvo-attention"

[verifier]
timeout_sec = 120.0
# Verifier only greps workspace + audit JSONL — no network
network_mode = "no-network"

[agent]
timeout_sec = 900.0
# Live xAI completions for arvo-chat
network_mode = "allowlist"
allowed_hosts = ["api.x.ai", "*.x.ai", "auth.x.ai"]

[solution]
# Oracle needs no credentials

[environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
# API key: pass at agent run time only via `harbor run --ae XAI_API_KEY`
# Release tarball uploaded by ArvoAgent (never bake into image)
