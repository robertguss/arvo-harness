schema_version = 1
program_id = "arvo-beam-harness-research"
program_name = "arvo-beam-harness-research"
rigor_tier = "focused" # focused | standard | high-assurance — approved with Blueprint
status = "active"      # active | blocked | completed | superseded
created_date = "2026-08-14"
last_updated_date = "2026-08-15"

[governance]
blueprint = "docs/00-program-blueprint.md"
charter = "docs/01-research-charter.md"
decisions_dir = "decisions"
methodology_dir = "program"
fresh_sessions_required = true
repository_first = true
human_approval_gates = true
just_in_time_prompts = true

[identifiers]
decisions = "DEC-001..DEC-999"
risks = "RSK-001..RSK-999"
open_questions = "OQ-001..OQ-999"
evidence_spikes = "SPK-001..SPK-999"
findings = "FND-001..FND-999"
requirements = "REQ-001..REQ-299"
phases = "PHASE-01..PHASE-99"
milestones = "MS-001..MS-999"

[replication]
enabled = true
default_required = false
reconciliation_required_when_used = true

[review]
additional_round_policy = "risk-triggered"

# Fixed governance spine plus three focused tracks from the Blueprint draft.

[[stages]]
id = "discovery"
kind = "discovery"
name = "Project Discovery"
status = "accepted"
depends_on = []
outputs = ["docs/00-program-blueprint.md"]
accepted_commit = "0b49540cae7d2a30ad4b4b145999e27b82c50dad"

[[stages]]
id = "charter"
kind = "research-charter"
name = "Research Charter"
status = "accepted"
prompt = "docs/prompts/01-research-charter-prompt.md"
depends_on = ["discovery"]
outputs = ["docs/01-research-charter.md"]
accepted_commit = "081ad36932be7f3f0df062b592cc306c49f72af4"

[[stages]]
id = "runtime"
kind = "independent"
name = "Runtime primitives"
status = "accepted"
prompt = "docs/prompts/10-runtime-research-prompt.md"
depends_on = ["charter"]
outputs = ["docs/reports/10-runtime-research-report.md"]
recommendation_range = "REC-001..REC-099"
accepted_commit = "636123f1a628803aa4ae2c44fc4659d167a80693"

[[stages]]
id = "leftovers"
kind = "independent"
name = "Paper leftovers"
status = "accepted"
prompt = "docs/prompts/11-leftovers-research-prompt.md"
depends_on = ["charter"]
outputs = ["docs/reports/11-leftovers-research-report.md"]
recommendation_range = "REC-100..REC-199"
accepted_commit = "9698362dbe5f90ff48e7aa1093d547d2e14d410a"

[[stages]]
id = "score-harness"
kind = "independent"
name = "Score the harness"
status = "accepted"
prompt = "docs/prompts/12-score-harness-research-prompt.md"
depends_on = ["charter"]
outputs = ["docs/reports/12-score-harness-research-report.md"]
recommendation_range = "REC-200..REC-299"
accepted_commit = "c15dd31c44c197340d2b339657eb7f072f066d44"

[[stages]]
id = "synthesis"
kind = "chief-architect-synthesis"
name = "Definitive Specification Synthesis"
status = "accepted"
prompt = "docs/prompts/13-chief-architect-synthesis-prompt.md"
outputs = ["docs/specifications/01-definitive-specification.md"]
